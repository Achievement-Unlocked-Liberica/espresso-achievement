# Test Application Properties
spring.application.name=Espresso-Achievement-Test

# Test Profile
spring.profiles.active=test

# Disable lazy initialization for tests
spring.main.lazy-initialization=false

# Test Database Configuration - Using H2 in-memory for tests (if needed later)
# spring.datasource.url=jdbc:h2:mem:testdb
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Disable actual database connections during mocked tests
# spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Disable AWS S3 during tests
cloud.aws.stack.auto=false
cloud.aws.region.auto=false

# Disable security for easier testing (will be overridden by @WithMockUser)
# spring.security.user.name=test
# spring.security.user.password=test

# Logging Configuration for Tests
logging.level.root=INFO
logging.level.espresso=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# Disable external service calls
# Azure AI Content Safety (disabled for tests)
azure.ai.contentsafety.enabled=false

# Server Configuration
server.error.include-message=always
server.error.include-stacktrace=never
